version = 4
final_space = true
shell_integration = true
async = true
enable_cursor_positioning = true
console_title_template = "\uf115 {{ .Folder }}"

# Transient prompt: replaces previous prompts in scrollback
[transient_prompt]
  background = "transparent"
  foreground = "p:white"
  template = "{{ .PWD }}{{ if .Root }}#{{ else }}${{ end }} "

# Secondary prompt: multi-line continuation
[secondary_prompt]
  background = "transparent"
  foreground = "p:yellow"
  template = "\u2237 "

# Right-aligned block: status, execution time
[[blocks]]
  type = "rprompt"
  alignment = "right"

  [[blocks.segments]]
    type = "status"
    style = "powerline"
    foreground = "p:white"
    background = "p:red"
    leading_powerline_symbol = "\ue0b2"
    template = " \ue654 {{ .Code }} "

    [blocks.segments.properties]
      always_enabled = false

  [[blocks.segments]]
    type = "executiontime"
    style = "powerline"
    foreground = "p:white"
    background = "p:red"
    leading_powerline_symbol = "\ue0b2"
    template = " \ueba2 {{ .FormattedMs }} "

    [blocks.segments.properties]
      always_enabled = true

# Left-aligned block: os, session, path (powerline bar)
[[blocks]]
  type = "prompt"
  alignment = "left"
  newline = true


  [[blocks.segments]]
    type = "os"
    style = "plain"
    foreground = "p:white"
    background = "transparent"
    template = " {{ if .WSL }}WSL at {{ end }}{{.Icon}} "

    [blocks.segments.properties]
      macos = "\uF179"

  [[blocks.segments]]
    type = "session"
    style = "powerline"
    foreground = "p:white"
    background = "p:green"
    powerline_symbol = "\ue0b0"
    template = "{{if .Root}} \uf0e7 {{.UserName}} {{else}} {{.UserName}} {{end}}"

    [blocks.segments.properties]
      display_host = false

  [[blocks.segments]]
    type = "path"
    style = "powerline"
    foreground = "p:black"
    background = "p:yellow"
    powerline_symbol = "\ue0b0"
    template = " {{ .Path }} "

    [blocks.segments.properties]
      folder_icon = "\uf115"
      folder_separator_icon = " \ue0b1 "
      max_depth = 2
      style = "agnoster_short"


# Tooltips: appear on the right when you type specific commands
[[tooltips]]
  type = "git"
  style = "powerline"
  foreground = "p:git-fg"
  background = "p:git-clean"
  leading_powerline_symbol = "\ue0b2"
  tips = ["git", "g"]
  template = " {{ .UpstreamIcon }}{{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} \uf040 {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }} \uf00c {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} \uf01c {{ .StashCount }}{{ end }} "
  background_templates = [
    "{{ if or (.Working.Changed) (.Staging.Changed) }}p:git-changed{{ end }}",
  ]

  [tooltips.options]
    fetch_status = true
    fetch_upstream_icon = true
    source = "cli"
    branch_max_length = 25
    [tooltips.options.mapped_branches]
      "feat/*" = "\uf135 "
      "bug/*" = "\uf188 "

[[tooltips]]
  type = "docker"
  style = "powerline"
  foreground = "p:white"
  background = "p:blue"
  leading_powerline_symbol = "\ue0b2"
  tips = ["docker", "docker-compose"]
  template = " \uf308 {{ .Context }} "

[[tooltips]]
  type = "python"
  style = "powerline"
  foreground = "p:white"
  background = "#3572A5"
  leading_powerline_symbol = "\ue0b2"
  tips = ["python", "python3", "pip", "uv", "venv"]
  template = " \ue235 {{ .Full }}{{ if .Venv }} \uf0e7 {{ .Venv }}{{ end }} "

  [tooltips.options]
    fetch_virtual_env = true
    display_mode = "always"

[[tooltips]]
  type = "aws"
  style = "powerline"
  foreground = "p:white"
  background = "#FF9900"
  leading_powerline_symbol = "\ue0b2"
  tips = ["aws"]
  template = " \ue7ad {{ .Profile }}{{ if .Region }} \uf0ac {{ .Region }}{{ end }} "

  [tooltips.options]
    display_default = true

[[tooltips]]
  type = "gcp"
  style = "powerline"
  foreground = "p:white"
  background = "#4285F4"
  leading_powerline_symbol = "\ue0b2"
  tips = ["gcloud", "gsutil"]
  template = " \uf1a0 {{ .Project }}{{ if .Account }} \uf007 {{ .Account }}{{ end }} "

[[tooltips]]
  type = "terraform"
  style = "powerline"
  foreground = "p:white"
  background = "#844FBA"
  leading_powerline_symbol = "\ue0b2"
  tips = ["terraform", "tf"]
  template = " \uf1bb {{ .WorkspaceName }}{{ if .Version }} {{ .Version }}{{ end }} "

  [tooltips.options]
    fetch_version = true

[[tooltips]]
  type = "lua"
  style = "powerline"
  foreground = "p:white"
  background = "#000080"
  leading_powerline_symbol = "\ue0b2"
  tips = ["lua", "luarocks"]
  template = " \ue620 {{ .Full }} "
